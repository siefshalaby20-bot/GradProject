server {
  listen 443 ssl http2; server_name treiii.online;
  root /var/www/treiii.online; index index.html;
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(png|svg|jpg|webp|css|js)$ { expires 30d; add_header Cache-Control "public"; }
  gzip on; gzip_types text/css application/javascript image/svg+xml application/json;
}
server { listen 80; server_name treiii.online www.treiii.online; return 301 https://treiii.online$request_uri; }
